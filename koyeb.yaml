services:
  - name: countdown-app
    type: web
    runtime: node
    region: fra
    build_command: npm install
    run_command: npm start
    instance_type: nano
    ports:
      - port: 3000
        protocol: http
    env:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        value: postgres://USER:PASSWORD@HOST:PORT/DATABASE

      - key: APP_URL
        value: https://countdown-app.koyeb.app
